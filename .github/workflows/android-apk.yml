name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['feat/android']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      # The Expo/React Native template signs release builds with the debug
      # keystore, so this APK installs directly on a phone (sideload, not Play Store).
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TrackYSF.apk
          ls -lh TrackYSF.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrackYSF-apk
          path: TrackYSF.apk

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TrackYSF.apk
